name: gilam_app
description: "Gilam yuvish biznesini boshqarish tizimi"
publish_to: 'none'

version: 2.1.1+40


environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  intl: ^0.20.2
  http: ^1.2.0
  dio: ^5.4.0
  telephony: ^0.2.0
  url_launcher: ^6.3.0
  web_socket_channel: ^3.0.1
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  shimmer: ^3.0.0
  fl_chart: ^0.70.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0277BD"
  adaptive_icon_foreground: "assets/icons/app_icon_fg.png"
  web:
    generate: false

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
